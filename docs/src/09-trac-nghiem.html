<script src="guide.js"></script><script src="panel-css.js"></script><script src="lms-mock.js"></script>
<script>

    <div class="qi"><span class="qn">Câu hỏi: 1</span><div class="qt">Chọn phương án Đúng trong các khẳng định sau:</div>

    <div class="qi"><span class="qn">Câu hỏi: 2</span><div class="qt">Trong các đáp án dưới đây, đáp án nào ĐÚNG:</div>
      <div class="qa">○ Pháp luật được đảm bảo thực hiện bằng cưỡng chế của các cộng đồng dân cư</div>

  mark(root.querySelector('.qsuggest'), 1, 'Bấm "Gợi ý đáp án", chờ 10–30 giây', 'right', { gap: 120, dy: -40 });
  mark('#note', 2, 'Đọc gợi ý + giải thích dưới mỗi câu', 'top', { gap: 34, dx: 90 });
  mark(root.querySelector('.qfill'), 3, 'Bấm "Điền gợi ý" (hoặc tự chọn)', 'right', { gap: 230, dy: 30 });
  mark('#submit', 4, 'Kiểm tra lại rồi TỰ bấm Nộp bài', 'left', { gap: 60 });
</script>
