<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Treo học VNU - Cài đặt AI</title>
  <style>
    body { font: 14px system-ui, "Segoe UI", sans-serif; max-width: 520px; margin: 32px auto; padding: 0 16px; color: #1f2328; }
    h1 { font-size: 18px; }
    label { display: block; margin: 16px 0 4px; font-weight: 600; }
    input, select { width: 100%; padding: 8px; box-sizing: border-box; font: inherit; }
    button { margin-top: 16px; padding: 8px 16px; font: inherit; font-weight: 600; color: #fff; background: #1f6feb; border: 0; border-radius: 6px; cursor: pointer; }
    .muted { color: #57606a; font-size: 13px; }
    #status { margin-left: 8px; color: #1a7f37; }
  </style>
</head>
<body>
  <h1>Trợ lý trắc nghiệm (AI)</h1>
  <p class="muted">Extension dùng khoá API Claude của bạn để gợi ý đáp án. Khoá chỉ lưu trong trình duyệt này,
    trang LMS không đọc được. Tạo khoá tại <a href="https://platform.claude.com/settings/keys" target="_blank">platform.claude.com</a>.</p>

  <label for="apiKey">Khoá API Claude</label>
  <input id="apiKey" type="password" autocomplete="off" placeholder="sk-ant-...">

  <label for="model">Model</label>
  <select id="model">
    <option value="claude-opus-5-5">Claude Opus 5.5 (chính xác nhất, mặc định)</option>
    <option value="claude-sonnet-5-5">Claude Sonnet 5.5 (nhanh, rẻ hơn)</option>
    <option value="claude-haiku-5-5">Claude Haiku 5.5 (rất rẻ, kém chính xác hơn)</option>
  </select>
  <p class="muted">Một bài 10 câu với Opus 5.5 tốn khoảng vài trăm đồng tiền API.</p>

  <button id="save">Lưu</button><span id="status"></span>
  <script src="options.js"></script>
</body>
</html>
